name: Check reading list

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-site.yml'
      - 'index.html'
      - '*.js'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/check-site.yml'
      - 'index.html'
      - '*.js'
      - 'tests/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and reading data
        run: |
          node --check app.js
          node --check readings.js
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const context = {window: {}};
          vm.runInNewContext(fs.readFileSync('readings.js', 'utf8'), context);
          const rows = context.window.UME_READINGS;
          if (rows.length !== 59 || new Set(rows.map(row => row[0])).size !== 59) throw new Error('Expected 59 unique readings');
          if (new Set(rows.map(row => row[1])).size !== 28) throw new Error('Expected 28 weeks');
          for (const row of rows) for (const url of [row[6], row[8]].filter(Boolean)) {
            if (new URL(url).protocol !== 'https:') throw new Error('Expected HTTPS link');
          }
          console.log('59 unique readings; 28 weeks; JavaScript syntax and URL formats valid.');
          JS
      - name: Diagnose public page and script delivery
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, urllib.request
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script': self.scripts.append(dict(attrs))
          urls = [
              'https://fyapeng.com/ume/',
              'https://fyapeng.com/ume/readings.js',
              'https://fyapeng.com/ume/app.js',
              'https://fyapeng.github.io/ume/',
          ]
          def probe(url):
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'UME-site-check/1.0', 'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=25) as res:
                      data=res.read(500000); text=data.decode('utf-8',errors='replace')
                      info={'url':url, 'final_url':res.url, 'status':res.status, 'bytes':len(data), 'headers':{k:v for k,v in res.headers.items() if k.lower() in ['content-type','content-security-policy','x-content-type-options','cache-control','cf-cache-status','age','last-modified','server']}, 'prefix':text[:180]}
                      if 'html' in res.headers.get('Content-Type',''):
                          parser=Scripts(); parser.feed(text); info['scripts']=parser.scripts
                      if url.endswith('.js'):
                          expected=pathlib.Path(url.rsplit('/',1)[-1]).read_bytes()
                          info['matches_repository']=data==expected
                          info['sha256']=hashlib.sha256(data).hexdigest()
                      return info
              except Exception as exc:
                  return {'url':url,'error':str(exc)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for info in pool.map(probe,urls): print(json.dumps(info, ensure_ascii=False))
          PY
